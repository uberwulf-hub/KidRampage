# Builds the Android version (an .apk you can install on a phone or tablet): a full-screen
# app that runs the same game as the PC version. Runs on pull requests that touch the game
# or the app (the .apk is kept as a download on the run's page), from Actions > Android >
# Run workflow, and as part of every Release, which attaches it as BoomBrothers-android.apk.
#
# Signing (same setup as Race Track Mayhem): Android only installs an update over an older
# copy if both were signed with the same key. Set these repository secrets once to use your
# own permanent key (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   the .keystore file, base64-encoded
#   ANDROID_KEYSTORE_ALIAS    the key's alias
#   ANDROID_KEYSTORE_PASSWORD its password
# Without them, a key is made on the first build and kept in the Actions cache
# (keep-android-key.yml stops GitHub from clearing it).
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, like v1.2.0"
        required: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  pull_request:
    paths:
      - "android/**"
      - "index.html"
      - "game.js"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keep the signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/android-key
          key: android-signing-key-v1

      - name: Set up signing
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/android-key
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > ~/android-key/secret.keystore
            KS=~/android-key/secret.keystore; ALIAS="$KEY_ALIAS"; PASS="$KEY_PASS"
            echo "Using the signing key from the repository secrets."
          else
            KS=~/android-key/release.keystore; ALIAS="boombrothers"; PASS="boombrothers"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=Boom Brothers, O=uberwulf, C=US"
              echo "::warning::Made a new signing key. Phones with an older copy must uninstall it before installing this one."
            else
              echo "Using the cached signing key."
            fi
          fi
          { echo "BB_KEYSTORE=$KS"; echo "BB_KEY_ALIAS=$ALIAS"; echo "BB_KEY_PASS=$PASS"; } >> "$GITHUB_ENV"

      - name: Put the game into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html game.js android/app/src/main/assets/

      - name: Build the .apk
        working-directory: android
        env:
          BB_VERSION: ${{ inputs.version || 'v1.0.0' }}
        run: |
          set -e
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../BoomBrothers-android.apk

      - name: Check the signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs BoomBrothers-android.apk | head -5
          ls -la BoomBrothers-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BoomBrothers-android.apk
