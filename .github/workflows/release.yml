# Builds the Windows and Android versions and publishes a GitHub release. SauceStore picks
# the release up automatically (it reads saucestore.json from the release's tag).
#
# Two ways to start it:
#   - push a version tag:   git tag v1.0.0 && git push origin v1.0.0
#   - or on GitHub: Actions > Release > Run workflow, and type the version (v1.0.0)
#
# Write what changed in release-notes/<version>.md first: SauceStore shows each
# line as the game's Version history.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if one already ran today"
        type: boolean
        default: false
      version:
        description: "Version to publish, like v1.0.0"
        required: true

permissions:
  actions: read
  contents: write

jobs:
  once-a-day:
    # Keeps GitHub's free 2,000 build minutes a month in budget: one release a day (days in UTC). To release again
    # today anyway, run this workflow by hand with "Release even if one already ran today" ticked.
    # While the repo is public (the go-public bandaid), builds don't use minutes, so there's no daily limit.
    runs-on: ubuntu-latest
    steps:
      - name: Only one release a day
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false" ]; then
            echo "The repo is public, so builds don't use minutes: no daily limit."
            exit 0
          fi
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=$(date -u +%Y-%m-%d)&status=success" --jq .total_count)
          if [ "$n" -gt 0 ]; then
            echo "::error::A release already ran today. To release again anyway, run it by hand with 'Release even if one already ran today' ticked."
            exit 1
          fi

  windows:
    needs: once-a-day
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod

      - name: Check the game's scripts load
        run: |
          node -e "new Function(require('fs').readFileSync('game.js', 'utf8'))"
          node --check server.js
          node --check audio/manifest.js
          node --check server/relay/relay-core.mjs
          python3 -c "import json; json.load(open('saucestore.json'))"

      - name: Install the Windows resource compiler (puts the icon into the .exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64

      - name: Build BoomBrothers.exe
        working-directory: launcher
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -e
          V="${VERSION#v}"
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "Version must look like v1.2.3, got $VERSION"; exit 1;; esac
          sed -i "s/1\.0\.0/$V/g; s/1,0,0,0/${V//./,},0/g" app.rc
          x86_64-w64-mingw32-windres --preprocessor=cpp -O coff -o rsrc_windows_amd64.syso app.rc
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../build/BoomBrothers.exe .
          test -s ../build/BoomBrothers.exe

      - name: Zip it up
        run: |
          set -e
          mkdir -p dist/zip/server/relay dist/zip/licenses
          cp build/BoomBrothers.exe index.html game.js server.js README.md dist/zip/
          cp -r audio dist/zip/
          cp server/relay/relay-core.mjs dist/zip/server/relay/
          cp licenses/* dist/zip/licenses/
          (cd dist/zip && zip -r -9 ../BoomBrothers-windows.zip .)
          unzip -l dist/BoomBrothers-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/BoomBrothers-windows.zip

  android:
    needs: once-a-day
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ls -la dist
          # SauceStore turns each line of the notes into its Version history.
          NOTES="release-notes/$VERSION.md"
          if [ -f "$NOTES" ]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          gh release create "$VERSION" dist/BoomBrothers-windows.zip dist/BoomBrothers-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Boom Brothers $VERSION" \
            "${NOTE_ARGS[@]}"
